name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  OTEL_SDK_DISABLED: "true"

jobs:
  lint:
    name: Lint, format and mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group lint --group typing --group test
      - run: uv run --no-sync ruff check src tests examples
      - run: uv run --no-sync ruff format --check src tests examples
      - run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group test
      - name: Tests with coverage gate (100%)
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  test-min:
    name: Tests (minimum supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
      - name: Install the lowest versions allowed by pyproject.toml
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e . --group test --group typing
          uv pip list | grep -E '^(claude-agent-sdk|acgs-lite) '
      - run: .venv/bin/python -m pytest --cov --cov-report=term-missing
      - run: .venv/bin/python -m mypy

  test-cli:
    name: Integration tests with the bundled Claude Code CLI (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest
            python-version: "3.14"
            resolution: highest
          - name: minimum
            python-version: "3.10"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (${{ matrix.resolution }} resolution)
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv venv
          uv pip install --resolution "$RESOLUTION" -e . --group test
          uv pip list | grep -E '^(claude-agent-sdk|acgs-lite) '
      - name: Run the CLI against a fake Messages API on 127.0.0.1 (no API key)
        run: .venv/bin/python -m pytest -m cli
